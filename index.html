<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemma 4 31B Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      height: -webkit-fill-available;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f8;
      color: #1a1a1a;
    }

    body {
      display: flex;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      background: #ffffff;
      border-right: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.25s, width 0.25s;
      overflow: hidden;
    }
    #sidebar.collapsed { width: 0; }

    @media (max-width: 640px) {
      #sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        z-index: 50;
        width: 280px;
        transform: translateX(-100%);
        box-shadow: 4px 0 20px rgba(0,0,0,0.1);
      }
      #sidebar.open { transform: translateX(0); }
      #sidebar-overlay {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.3);
        z-index: 40;
      }
      #sidebar-overlay.visible { display: block; }
    }

    #sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #e5e5e5;
    }

    #new-chat-btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    #new-chat-btn:hover { background: #1d4ed8; }

    #conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.1s;
      group: true;
    }
    .conv-item:hover { background: #f3f4f6; }
    .conv-item.active { background: #eff6ff; }

    .conv-title {
      flex: 1;
      font-size: 13px;
      color: #374151;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-date {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
    }
    .conv-delete {
      background: none;
      border: none;
      color: #d1d5db;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.1s, color 0.1s;
      flex-shrink: 0;
    }
    .conv-item:hover .conv-delete { opacity: 1; }
    .conv-delete:hover { color: #ef4444; }

    .conv-item-inner {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    /* ── Main area ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 12px 20px;
      border-bottom: 1px solid #e5e5e5;
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #sidebar-toggle {
      background: none;
      border: none;
      cursor: pointer;
      color: #6b7280;
      font-size: 18px;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.1s;
      line-height: 1;
    }
    #sidebar-toggle:hover { background: #f3f4f6; }

    #dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #d1d5db;
      flex-shrink: 0;
    }
    #dot.online { background: #22c55e; }

    header h1 { font-size: 15px; font-weight: 600; color: #111; }
    header .sub { font-size: 12px; color: #9ca3af; }

    #token-count { font-size: 12px; color: #9ca3af; margin-left: auto; }

    #cost-counter {
      font-size: 12px;
      color: #16a34a;
      font-variant-numeric: tabular-nums;
      margin-left: 10px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #cost-counter.visible { opacity: 1; }

    #balance-display {
      font-size: 12px;
      color: #6b7280;
      font-variant-numeric: tabular-nums;
      margin-left: 8px;
    }
    #balance-display.low { color: #f59e0b; }

    #backend-select, #model-select {
      background: none;
      border: none;
      font-size: 12px;
      color: #9ca3af;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
      margin-left: 2px;
      outline: none;
    }
    #backend-select:hover, #model-select:hover { color: #6b7280; }

    .header-sep {
      font-size: 12px;
      color: #d1d5db;
      margin: 0 2px;
    }

    /* ── System prompt panel ── */
    #system-panel {
      border-bottom: 1px solid #e5e5e5;
      background: #fafafa;
      flex-shrink: 0;
    }

    #system-toggle {
      width: 100%;
      padding: 9px 20px;
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 11px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: color 0.15s;
    }
    #system-toggle:hover { color: #6b7280; }
    #system-toggle .arrow { transition: transform 0.2s; display: inline-block; }
    #system-toggle.open .arrow { transform: rotate(90deg); }

    #system-body { display: none; padding: 0 20px 12px; }
    #system-body.open { display: block; }

    #system-prompt {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 10px 14px;
      color: #1a1a1a;
      font-size: 13px;
      resize: vertical;
      outline: none;
      min-height: 60px;
      max-height: 180px;
      font-family: inherit;
      line-height: 1.5;
    }
    #system-prompt:focus { border-color: #2563eb; }

    #system-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .sys-btn {
      background: none;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      color: #6b7280;
      font-size: 11px;
      padding: 3px 10px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.1s;
    }
    .sys-btn:hover { border-color: #9ca3af; color: #374151; }

    /* ── Tokens row ── */
    #tokens-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 20px;
      border-bottom: 1px solid #e5e5e5;
      background: #fafafa;
      flex-shrink: 0;
    }
    #tokens-row label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
    #max-tokens-slider { flex: 1; accent-color: #2563eb; cursor: pointer; }
    #max-tokens-value { font-size: 12px; color: #6b7280; min-width: 36px; text-align: right; }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message { max-width: 680px; line-height: 1.65; font-size: 15px; }

    .message.user {
      align-self: flex-end;
      background: #2563eb;
      padding: 10px 16px;
      border-radius: 18px 18px 4px 18px;
      color: #ffffff;
    }

    .message.assistant {
      align-self: flex-start;
      color: #1a1a1a;
      white-space: pre-wrap;
    }

    .message.assistant .label {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Edit button on user messages */
    .message.user {
      position: relative;
    }
    .user-actions {
      position: absolute;
      left: -36px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 3px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .message.user:hover .user-actions { opacity: 1; }

    .user-edit-btn, .user-del-btn {
      background: none;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      color: #9ca3af;
      font-size: 11px;
      padding: 2px 6px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .user-edit-btn:hover { color: #2563eb; border-color: #2563eb; }
    .user-del-btn:hover  { color: #ef4444; border-color: #ef4444; }

    /* Edit button on assistant messages */
    .edit-btn, .del-btn {
      background: none;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      color: #9ca3af;
      font-size: 11px;
      padding: 1px 7px;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .edit-btn:hover { color: #2563eb; border-color: #2563eb; }
    .del-btn:hover  { color: #ef4444; border-color: #ef4444; }

    .edit-area {
      width: 100%;
      background: #ffffff;
      border: 1px solid #2563eb;
      border-radius: 10px;
      padding: 10px 14px;
      color: #1a1a1a;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      margin-top: 6px;
      overflow-y: hidden;
    }

    .edit-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .edit-save {
      background: #2563eb;
      border: none;
      border-radius: 7px;
      color: white;
      font-size: 12px;
      padding: 4px 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .edit-cancel {
      background: none;
      border: 1px solid #e5e5e5;
      border-radius: 7px;
      color: #6b7280;
      font-size: 12px;
      padding: 4px 12px;
      cursor: pointer;
      font-family: inherit;
    }

    .typing { display: inline-block; color: #9ca3af; font-size: 20px; letter-spacing: 2px; }

    /* ── Input area ── */
    #input-area {
      padding: 14px 20px;
      border-top: 1px solid #e5e5e5;
      background: #ffffff;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #input-area.dragover {
      border-top-color: #2563eb;
      background: #eff6ff;
    }

    #prompt {
      flex: 1;
      background: #f7f7f8;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 11px 16px;
      color: #1a1a1a;
      font-size: 15px;
      resize: none;
      outline: none;
      max-height: 160px;
      line-height: 1.5;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    #prompt:focus { border-color: #2563eb; background: #ffffff; }

    #send {
      background: #2563eb;
      border: none;
      border-radius: 10px;
      width: 40px; height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #send:hover { background: #1d4ed8; }
    #send:disabled { background: #e5e5e5; cursor: not-allowed; }
    #send svg { width: 17px; height: 17px; fill: white; }

    #stop {
      background: #fee2e2;
      border: none;
      border-radius: 10px;
      width: 40px; height: 40px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #stop:hover { background: #fecaca; }
    #stop svg { width: 14px; height: 14px; fill: #ef4444; }

    #clear {
      background: none;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      width: 40px; height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 15px;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #clear:hover { border-color: #9ca3af; color: #374151; }

    #save-btn {
      background: none;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      width: 40px; height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 15px;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
      title: "Salva conversazione";
    }
    #save-btn:hover { border-color: #22c55e; color: #16a34a; }

    #export-btn {
      background: none;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      width: 40px; height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 15px;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #export-btn:hover { border-color: #0ea5e9; color: #0284c7; }

    #attach-btn {
      background: none;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      width: 40px; height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 15px;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #attach-btn:hover { border-color: #2563eb; color: #2563eb; }
    #attachment-input { display: none; }

    #attachment-strip {
      display: none;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 20px 0;
      border-top: 1px solid #e5e5e5;
      background: #ffffff;
    }
    #attachment-strip.visible { display: flex; }

    .attachment-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      background: #fafafa;
      padding: 6px 8px;
      min-width: 180px;
      max-width: 260px;
      flex-shrink: 0;
    }
    .attachment-pill img, .attachment-pill video {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
      background: #e5e7eb;
      flex-shrink: 0;
    }
    .attachment-pill .meta {
      min-width: 0;
      flex: 1;
    }
    .attachment-pill .name {
      font-size: 12px;
      color: #374151;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .attachment-pill .type {
      font-size: 11px;
      color: #9ca3af;
    }
    .attachment-remove {
      border: none;
      background: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
      padding: 0 2px;
    }
    .attachment-remove:hover { color: #ef4444; }

    .message-attachments {
      margin-top: 8px;
      display: grid;
      gap: 8px;
    }
    .msg-attachment {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.1);
      max-width: 280px;
    }
    .msg-attachment img, .msg-attachment video {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      background: #e5e7eb;
    }
    .msg-attachment .fallback {
      padding: 8px 10px;
      font-size: 12px;
      color: #e5e7eb;
      background: rgba(0, 0, 0, 0.15);
    }

    #upload-hint {
      display: none;
      padding: 6px 20px 0;
      font-size: 12px;
      color: #2563eb;
      background: #ffffff;
    }
    #upload-hint.visible { display: block; }

    #status-msg {
      display: none;
      padding: 6px 20px 0;
      font-size: 12px;
      background: #ffffff;
    }
    #status-msg.visible { display: block; }
    #status-msg.error { color: #dc2626; }
    #status-msg.success { color: #16a34a; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e5e5e5; border-radius: 2px; }
  </style>
</head>
<body>

<!-- Sidebar overlay (mobile) -->
<div id="sidebar-overlay"></div>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <button id="new-chat-btn">+ New chat</button>
  </div>
  <div id="conv-list"></div>
</div>

<!-- Main -->
<div id="main">
  <header>
    <button id="sidebar-toggle" title="Conversazioni">☰</button>
    <div id="dot"></div>
    <h1>Gemma 4 31B</h1>
    <select id="backend-select" title="Backend">
      <option value="openrouter">OpenRouter</option>
      <option value="google">Google AI Studio</option>
    </select>
    <span class="header-sep">·</span>
    <select id="model-select" title="Modello"></select>
    <span id="token-count"></span>
    <span id="cost-counter">$0.00000</span>
    <span id="balance-display">saldo: …</span>
  </header>

  <div id="system-panel">
    <button id="system-toggle">
      <span class="arrow">›</span> System Prompt
    </button>
    <div id="system-body">
      <textarea id="system-prompt" placeholder="You are a helpful assistant…"></textarea>
      <div id="system-actions">
        <button class="sys-btn" id="reset-system">Reset default</button>
      </div>
    </div>
  </div>

  <div id="tokens-row">
    <label>Max tokens</label>
    <input type="range" id="max-tokens-slider" min="128" max="4096" step="128" value="2048" />
    <span id="max-tokens-value">2048</span>
  </div>

  <div id="messages"></div>
  <div id="attachment-strip"></div>
  <div id="upload-hint">Rilascia qui immagini o video per allegarli</div>
  <div id="status-msg"></div>

  <div id="input-area">
    <button id="clear" title="Nuova chat">✕</button>
    <button id="save-btn" title="Salva conversazione">💾</button>
    <button id="export-btn" title="Esporta chat">⤓</button>
    <button id="attach-btn" title="Allega immagini o video">📎</button>
    <input id="attachment-input" type="file" accept="image/*,video/*" multiple />
    <textarea id="prompt" rows="1" placeholder="Message Gemma…"></textarea>
    <button id="send">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
    <button id="stop" title="Stop generation">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
    </button>
  </div>
</div>

<script>
  // ── Elements ──────────────────────────────────────────────────
  const messagesEl   = document.getElementById("messages");
  const promptEl     = document.getElementById("prompt");
  const systemEl     = document.getElementById("system-prompt");
  const sendBtn      = document.getElementById("send");
  const stopBtn      = document.getElementById("stop");
  const clearBtn     = document.getElementById("clear");
  const saveBtn      = document.getElementById("save-btn");
  const exportBtn    = document.getElementById("export-btn");
  const attachBtn    = document.getElementById("attach-btn");
  const attachInput  = document.getElementById("attachment-input");
  const attachStrip  = document.getElementById("attachment-strip");
  const uploadHint   = document.getElementById("upload-hint");
  const statusMsgEl  = document.getElementById("status-msg");
  const dot          = document.getElementById("dot");
  const toggleBtn    = document.getElementById("system-toggle");
  const systemBody   = document.getElementById("system-body");
  const tokenCount   = document.getElementById("token-count");
  const maxSlider    = document.getElementById("max-tokens-slider");
  const maxValue     = document.getElementById("max-tokens-value");
  const costCounter  = document.getElementById("cost-counter");
  const balanceEl    = document.getElementById("balance-display");
  const sidebarEl    = document.getElementById("sidebar");
  const sidebarToggle= document.getElementById("sidebar-toggle");
  const newChatBtn   = document.getElementById("new-chat-btn");
  const convList     = document.getElementById("conv-list");
  const resetSystem   = document.getElementById("reset-system");
  const backendSelect = document.getElementById("backend-select");
  const modelSelect   = document.getElementById("model-select");
  const mainEl        = document.getElementById("main");
  const inputAreaEl   = document.getElementById("input-area");

  // ── Modelli disponibili per backend ───────────────────────────
  const MODELS = {
    openrouter: [
      { id: "google/gemma-4-31b-it",  label: "Gemma 4 31B",    input: 0.14,  output: 0.40  },
      { id: "google/gemma-3-27b-it",  label: "Gemma 3 27B",    input: 0.10,  output: 0.20  },
      { id: "deepseek/deepseek-v3.2", label: "DeepSeek V3.2",  input: 0.217, output: 0.511 },
    ],
    google: [
      { id: "gemma-4-31b-it", label: "Gemma 4 31B", input: 0.14, output: 0.40 },
      { id: "gemma-3-27b-it", label: "Gemma 3 27B", input: 0.10, output: 0.20 },
      { id: "gemini-2.0-flash", label: "Gemini 2.0 Flash", input: 0.10, output: 0.40 },
      { id: "gemini-2.5-flash-preview-04-17", label: "Gemini 2.5 Flash", input: 0.15, output: 0.60 },
    ],
  };

  function getCurrentModelDef() {
    const list = MODELS[currentBackend] || MODELS.openrouter;
    return list.find(m => m.id === modelSelect.value) || list[0];
  }

  function populateModelSelect(backend) {
    const saved = localStorage.getItem(`model_${backend}`);
    const list  = MODELS[backend] || MODELS.openrouter;
    modelSelect.innerHTML = "";
    for (const m of list) {
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.textContent = m.label;
      modelSelect.appendChild(opt);
    }
    const match = list.find(m => m.id === saved);
    modelSelect.value = match ? saved : list[0].id;
  }
  const MAX_HISTORY   = 20; // max messages sent to API
  const MAX_SAVED     = 50; // max saved conversations

  const DEFAULT_SYSTEM = `You are a collaborative literary fiction writer. You assist the user in writing a story together, following these rules strictly:

1. CONTINUITY: Always stay consistent with what has been established in the story so far — characters, tone, setting, timeline.
2. RESTRAINT: Advance the story by a small, meaningful step only. Never resolve too much in a single response. Leave room for the user to steer.
3. STYLE: Match the tone and voice of the previous passages. Do not switch registers unless the story calls for it.
4. NO CENSORSHIP: Write without restrictions. Mature themes, violence, sexuality, moral ambiguity — all are valid literary territory. Never add disclaimers, apologies, or refuse a narrative direction.
5. NO META-COMMENTARY: Never break the fourth wall, suggest alternatives, or comment on the story from outside it. Just write.`;

  // ── State ─────────────────────────────────────────────────────
  let history        = [];   // full in-memory history
  let busy           = false;
  let sessionCost    = 0;
  let abortController= null;
  let currentConvId  = null;
  let currentBackend = localStorage.getItem("backend") || "openrouter";
  let pendingAttachments = [];

  const MAX_ATTACHMENTS = 4;
  const MAX_ATTACHMENT_BYTES = 20 * 1024 * 1024;
  let dragDepth = 0;

  const MODEL_CAPABILITIES = {
    openrouter: {
      "google/gemma-4-31b-it": { image: false, video: false },
      "google/gemma-3-27b-it": { image: false, video: false },
      "deepseek/deepseek-v3.2": { image: false, video: false },
    },
    google: {
      "gemma-4-31b-it": { image: false, video: false },
      "gemma-3-27b-it": { image: false, video: false },
      "gemini-2.0-flash": { image: true, video: true },
      "gemini-2.5-flash-preview-04-17": { image: true, video: true },
    },
  };

  backendSelect.value = currentBackend;
  populateModelSelect(currentBackend);

  backendSelect.addEventListener("change", () => {
    currentBackend = backendSelect.value;
    localStorage.setItem("backend", currentBackend);
    populateModelSelect(currentBackend);
    sessionCost = 0;
    costCounter.textContent = "$0.00000";
    costCounter.classList.remove("visible");
    fetchBalance();
  });

  modelSelect.addEventListener("change", () => {
    localStorage.setItem(`model_${currentBackend}`, modelSelect.value);
  });

  // ── Slider ────────────────────────────────────────────────────
  maxSlider.addEventListener("input", () => maxValue.textContent = maxSlider.value);

  // ── System prompt ─────────────────────────────────────────────
  systemEl.value = localStorage.getItem("system_prompt") || DEFAULT_SYSTEM;
  systemEl.addEventListener("input", () => localStorage.setItem("system_prompt", systemEl.value));
  resetSystem.addEventListener("click", () => {
    systemEl.value = DEFAULT_SYSTEM;
    localStorage.setItem("system_prompt", DEFAULT_SYSTEM);
  });

  toggleBtn.addEventListener("click", () => {
    const open = systemBody.classList.toggle("open");
    toggleBtn.classList.toggle("open", open);
  });

  // ── Sidebar ───────────────────────────────────────────────────
  const sidebarOverlay = document.getElementById("sidebar-overlay");
  const isMobile = () => window.innerWidth <= 640;

  sidebarToggle.addEventListener("click", () => {
    if (isMobile()) {
      sidebarEl.classList.toggle("open");
      sidebarOverlay.classList.toggle("visible", sidebarEl.classList.contains("open"));
    } else {
      sidebarEl.classList.toggle("collapsed");
    }
  });
  sidebarOverlay.addEventListener("click", () => {
    sidebarEl.classList.remove("open");
    sidebarOverlay.classList.remove("visible");
  });

  // ── Conversations (localStorage) ─────────────────────────────
  function getConversations() {
    try { return JSON.parse(localStorage.getItem("conversations") || "[]"); }
    catch { return []; }
  }

  function toStorableMessage(msg) {
    const attachments = (msg.attachments || []).map(a => ({
      type: a.type,
      name: a.name,
      mimeType: a.mimeType,
      size: a.size,
      unavailable: true,
    }));
    return {
      role: msg.role,
      content: msg.content || "",
      model: msg.model,
      attachments,
    };
  }

  function saveCurrentConversation() {
    if (history.length === 0) return;
    const convs = getConversations();
    const firstUser = history.find(m => m.role === "user");
    const title = firstUser ? firstUser.content.slice(0, 60) : "Conversazione";
    const id = currentConvId || Date.now().toString();
    currentConvId = id;
    const existing = convs.findIndex(c => c.id === id);
    const conv = {
      id,
      title,
      date: new Date().toISOString(),
      messages: history.map(toStorableMessage),
    };
    if (existing >= 0) convs[existing] = conv;
    else convs.unshift(conv);
    localStorage.setItem("conversations", JSON.stringify(convs.slice(0, MAX_SAVED)));
    renderConvList();
  }

  function deleteConversation(id) {
    const convs = getConversations().filter(c => c.id !== id);
    localStorage.setItem("conversations", JSON.stringify(convs));
    if (currentConvId === id) { currentConvId = null; }
    renderConvList();
  }

  function loadConversation(id) {
    const conv = getConversations().find(c => c.id === id);
    if (!conv) return;
    currentConvId = id;
    history = [...conv.messages];
    sessionCost = 0;
    costCounter.textContent = "$0.00000";
    costCounter.classList.remove("visible");
    messagesEl.innerHTML = "";
    clearPendingAttachments();
    for (let i = 0; i < history.length; i++) {
      const msg = history[i];
      if (msg.role === "user") renderUserMessage(msg.content, i, msg.attachments || []);
      else renderAssistantMessage(msg.content, i, msg.model);
    }
    updateTokenCount();
    renderConvList();
  }

  function formatDate(iso) {
    const d = new Date(iso);
    const today = new Date();
    if (d.toDateString() === today.toDateString()) {
      return d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
    }
    return d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" });
  }

  function renderConvList() {
    const convs = getConversations();
    convList.innerHTML = "";
    if (convs.length === 0) {
      const empty = document.createElement("div");
      empty.style.padding = "12px";
      empty.style.fontSize = "12px";
      empty.style.color = "#9ca3af";
      empty.style.textAlign = "center";
      empty.textContent = "Nessuna conversazione salvata";
      convList.appendChild(empty);
      return;
    }
    for (const conv of convs) {
      const item = document.createElement("div");
      item.className = "conv-item" + (conv.id === currentConvId ? " active" : "");

      const inner = document.createElement("div");
      inner.className = "conv-item-inner";

      const title = document.createElement("div");
      title.className = "conv-title";
      title.textContent = conv.title;

      const date = document.createElement("div");
      date.className = "conv-date";
      date.textContent = formatDate(conv.date);

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "conv-delete";
      deleteBtn.title = "Elimina";
      deleteBtn.textContent = "✕";

      inner.appendChild(title);
      inner.appendChild(date);
      item.appendChild(inner);
      item.appendChild(deleteBtn);

      inner.addEventListener("click", () => loadConversation(conv.id));
      deleteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteConversation(conv.id);
      });
      convList.appendChild(item);
    }
  }

  renderConvList();

  newChatBtn.addEventListener("click", () => {
    history = [];
    currentConvId = null;
    messagesEl.innerHTML = "";
    clearPendingAttachments();
    sessionCost = 0;
    costCounter.textContent = "$0.00000";
    costCounter.classList.remove("visible");
    tokenCount.textContent = "";
    renderConvList();
  });

  saveBtn.addEventListener("click", () => {
    if (history.length === 0) return;
    saveCurrentConversation();
    saveBtn.textContent = "✓";
    setTimeout(() => saveBtn.textContent = "💾", 1500);
  });

  function getExportMarkdown() {
    const lines = [];
    const title = (history.find(m => m.role === "user")?.content || "Chat").slice(0, 80);
    lines.push(`# ${title || "Chat Export"}`);
    lines.push("");
    lines.push(`Exported: ${new Date().toISOString()}`);
    lines.push(`Backend: ${currentBackend}`);
    lines.push(`Model: ${modelSelect.value}`);
    lines.push("");

    for (const msg of history) {
      const role = msg.role === "assistant" ? "Assistant" : "User";
      lines.push(`## ${role}`);
      lines.push("");
      lines.push(msg.content || "");
      lines.push("");
      if (msg.role === "user" && Array.isArray(msg.attachments) && msg.attachments.length > 0) {
        lines.push("Attachments:");
        for (const att of msg.attachments) {
          lines.push(`- ${att.name || "file"} (${att.type || "file"})`);
        }
        lines.push("");
      }
    }
    return lines.join("\n");
  }

  function downloadTextFile(filename, content) {
    const blob = new Blob([content], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  exportBtn.addEventListener("click", () => {
    if (history.length === 0) {
      showStatus("Nessuna chat da esportare.", true);
      return;
    }
    const stamp = new Date().toISOString().replace(/[:.]/g, "-");
    downloadTextFile(`chat-export-${stamp}.md`, getExportMarkdown());
    showStatus("Chat esportata in .md", false);
  });

  // ── Rendering ─────────────────────────────────────────────────
  function deleteMessage(histIdx) {
    history.splice(histIdx, 1);
    rerenderMessages();
    updateTokenCount();
  }

  function rerenderMessages() {
    messagesEl.innerHTML = "";
    for (let i = 0; i < history.length; i++) {
      const msg = history[i];
      if (msg.role === "user") renderUserMessage(msg.content, i, msg.attachments || []);
      else renderAssistantMessage(msg.content, i, msg.model);
    }
  }

  function renderMessageAttachments(parent, attachments) {
    if (!attachments || attachments.length === 0) return;

    const wrap = document.createElement("div");
    wrap.className = "message-attachments";

    for (const att of attachments) {
      const box = document.createElement("div");
      box.className = "msg-attachment";

      if (att.type === "image" && att.dataUrl) {
        const img = document.createElement("img");
        img.src = att.dataUrl;
        img.alt = att.name || "image";
        box.appendChild(img);
      } else if (att.type === "video" && att.dataUrl) {
        const video = document.createElement("video");
        video.src = att.dataUrl;
        video.controls = true;
        video.preload = "metadata";
        box.appendChild(video);
      } else {
        const fallback = document.createElement("div");
        fallback.className = "fallback";
        fallback.textContent = att.unavailable
          ? `${att.name || "Allegato"} (non disponibile in questa sessione)`
          : (att.name || "Allegato");
        box.appendChild(fallback);
      }

      wrap.appendChild(box);
    }

    parent.appendChild(wrap);
  }

  function renderUserMessage(text, histIdx, attachments = []) {
    const div = document.createElement("div");
    div.className = "message user";
    div.dataset.histIdx = histIdx;

    const actions = document.createElement("div");
    actions.className = "user-actions";

    const editBtn = document.createElement("button");
    editBtn.className = "user-edit-btn";
    editBtn.textContent = "edit";
    editBtn.addEventListener("click", () => startUserEdit(div, content, histIdx));
    actions.appendChild(editBtn);

    const delBtn = document.createElement("button");
    delBtn.className = "user-del-btn";
    delBtn.textContent = "del";
    delBtn.addEventListener("click", () => deleteMessage(histIdx));
    actions.appendChild(delBtn);

    div.appendChild(actions);

    const content = document.createElement("div");
    content.className = "content";
    content.textContent = text;
    div.appendChild(content);
    renderMessageAttachments(div, attachments);

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function renderAssistantMessage(text, histIdx, modelLabel) {
    const div = document.createElement("div");
    div.className = "message assistant";
    div.dataset.histIdx = histIdx;

    const label = document.createElement("div");
    label.className = "label";
    const labelText = document.createElement("span");
    labelText.textContent = modelLabel || "Gemma";
    label.appendChild(labelText);

    const editBtn = document.createElement("button");
    editBtn.className = "edit-btn";
    editBtn.textContent = "edit";
    editBtn.addEventListener("click", () => startAssistantEdit(div, content, histIdx));
    label.appendChild(editBtn);

    const delBtn = document.createElement("button");
    delBtn.className = "del-btn";
    delBtn.textContent = "del";
    delBtn.addEventListener("click", () => deleteMessage(histIdx));
    label.appendChild(delBtn);

    div.appendChild(label);

    const content = document.createElement("div");
    content.className = "content";
    content.textContent = text;
    div.appendChild(content);

    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return content;
  }

  // Edit user message → truncate and regenerate
  function startUserEdit(div, content, histIdx) {
    if (div.querySelector(".edit-area")) return;
    const area = document.createElement("textarea");
    area.className = "edit-area";
    area.value = content.textContent;
    content.style.display = "none";

    const actions = document.createElement("div");
    actions.className = "edit-actions";
    const saveBtn2 = document.createElement("button");
    saveBtn2.className = "edit-save";
    saveBtn2.textContent = "Send";
    const cancelBtn = document.createElement("button");
    cancelBtn.className = "edit-cancel";
    cancelBtn.textContent = "Cancel";
    actions.appendChild(saveBtn2);
    actions.appendChild(cancelBtn);
    div.appendChild(area);
    div.appendChild(actions);

    area.style.height = "auto";
    area.style.height = area.scrollHeight + "px";
    area.addEventListener("input", () => { area.style.height = "auto"; area.style.height = area.scrollHeight + "px"; });
    area.focus();

    cancelBtn.addEventListener("click", () => {
      area.remove(); actions.remove(); content.style.display = "";
    });

    saveBtn2.addEventListener("click", async () => {
      const newText = area.value.trim();
      if (!newText) return;
      // Truncate history from this index onwards
      history = history.slice(0, histIdx);
      // Remove all DOM messages from this index onwards
      const allMessages = [...messagesEl.querySelectorAll(".message")];
      for (const m of allMessages) {
        if (parseInt(m.dataset.histIdx) >= histIdx) m.remove();
      }
      // Send new message
      await sendMessage(newText);
    });
  }

  // Edit assistant message (text only, no regeneration)
  function startAssistantEdit(div, content, histIdx) {
    if (div.querySelector(".edit-area")) return;
    const area = document.createElement("textarea");
    area.className = "edit-area";
    area.value = content.textContent;
    content.style.display = "none";

    const actions = document.createElement("div");
    actions.className = "edit-actions";
    const saveBtn2 = document.createElement("button");
    saveBtn2.className = "edit-save";
    saveBtn2.textContent = "Save";
    const cancelBtn = document.createElement("button");
    cancelBtn.className = "edit-cancel";
    cancelBtn.textContent = "Cancel";
    actions.appendChild(saveBtn2);
    actions.appendChild(cancelBtn);
    div.appendChild(area);
    div.appendChild(actions);

    area.style.height = "auto";
    area.style.height = area.scrollHeight + "px";
    area.addEventListener("input", () => { area.style.height = "auto"; area.style.height = area.scrollHeight + "px"; });
    area.focus();

    cancelBtn.addEventListener("click", () => {
      area.remove(); actions.remove(); content.style.display = "";
    });

    saveBtn2.addEventListener("click", () => {
      const newText = area.value.trim();
      if (!newText) return;
      content.textContent = newText;
      content.style.display = "";
      area.remove(); actions.remove();
      if (history[histIdx]) history[histIdx].content = newText;
    });
  }

  // ── Token count ───────────────────────────────────────────────
  function updateTokenCount() {
    const total = history.reduce((a, m) => a + (m.content || "").length, 0);
    tokenCount.textContent = `~${Math.round(total / 4)} tokens`;
  }

  function formatFileSize(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  }

  function clearPendingAttachments() {
    pendingAttachments = [];
    attachInput.value = "";
    renderAttachmentStrip();
  }

  function showStatus(message, isError) {
    if (!message) {
      statusMsgEl.className = "";
      statusMsgEl.textContent = "";
      return;
    }
    statusMsgEl.textContent = message;
    statusMsgEl.className = `visible ${isError ? "error" : "success"}`;
    setTimeout(() => {
      if (statusMsgEl.textContent === message) {
        statusMsgEl.className = "";
        statusMsgEl.textContent = "";
      }
    }, 3500);
  }

  function getCurrentModelCapabilities() {
    const backendCaps = MODEL_CAPABILITIES[currentBackend] || {};
    return backendCaps[modelSelect.value] || { image: false, video: false };
  }

  function getCapabilityError(attachments) {
    if (!attachments || attachments.length === 0) return "";
    const hasImage = attachments.some(a => a.type === "image");
    const hasVideo = attachments.some(a => a.type === "video");
    const caps = getCurrentModelCapabilities();
    if (hasVideo && !caps.video) {
      return "Il modello selezionato non supporta video. Usa Google AI Studio + Gemini.";
    }
    if (hasImage && !caps.image) {
      return "Il modello selezionato non supporta immagini. Usa Google AI Studio + Gemini.";
    }
    return "";
  }

  function normalizeErrorMessage(raw, attachments) {
    const msg = String(raw || "").toLowerCase();
    if (msg.includes("input_video") || msg.includes("video")) {
      return "Il provider ha rifiutato il video: prova con Google AI Studio + Gemini.";
    }
    if (msg.includes("image_url") || msg.includes("image")) {
      return "Il provider ha rifiutato l'immagine: prova con Google AI Studio + Gemini.";
    }
    if (attachments?.length) {
      return `Errore multimodale: ${raw || "richiesta non accettata dal provider."}`;
    }
    return raw || "server non raggiungibile.";
  }

  function renderAttachmentStrip() {
    attachStrip.innerHTML = "";
    attachStrip.classList.toggle("visible", pendingAttachments.length > 0);
    for (const att of pendingAttachments) {
      const pill = document.createElement("div");
      pill.className = "attachment-pill";

      if (att.type === "image") {
        const img = document.createElement("img");
        img.src = att.dataUrl;
        img.alt = att.name;
        pill.appendChild(img);
      } else {
        const video = document.createElement("video");
        video.src = att.dataUrl;
        video.muted = true;
        video.preload = "metadata";
        pill.appendChild(video);
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = att.name;
      const type = document.createElement("div");
      type.className = "type";
      type.textContent = `${att.type} • ${formatFileSize(att.size)}`;
      meta.appendChild(name);
      meta.appendChild(type);
      pill.appendChild(meta);

      const remove = document.createElement("button");
      remove.className = "attachment-remove";
      remove.title = "Rimuovi allegato";
      remove.textContent = "✕";
      remove.addEventListener("click", () => {
        pendingAttachments = pendingAttachments.filter(x => x.id !== att.id);
        renderAttachmentStrip();
      });
      pill.appendChild(remove);

      attachStrip.appendChild(pill);
    }
  }

  function readAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function addAttachmentsFromFiles(files) {
    if (files.length === 0) return;
    if (pendingAttachments.length + files.length > MAX_ATTACHMENTS) {
      showStatus(`Puoi allegare massimo ${MAX_ATTACHMENTS} file per messaggio.`, true);
      return;
    }
    for (const file of files) {
      const isImage = file.type.startsWith("image/");
      const isVideo = file.type.startsWith("video/");
      if (!isImage && !isVideo) continue;
      if (file.size > MAX_ATTACHMENT_BYTES) {
        showStatus(`${file.name} supera il limite di 20MB.`, true);
        continue;
      }
      const dataUrl = await readAsDataUrl(file);
      pendingAttachments.push({
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        type: isImage ? "image" : "video",
        name: file.name,
        mimeType: file.type,
        size: file.size,
        dataUrl,
      });
    }
    renderAttachmentStrip();
  }

  attachBtn.addEventListener("click", () => attachInput.click());
  attachInput.addEventListener("change", async (e) => {
    const files = [...(e.target.files || [])];
    await addAttachmentsFromFiles(files);
    attachInput.value = "";
  });

  function eventHasFiles(event) {
    return [...(event.dataTransfer?.types || [])].includes("Files");
  }

  function showDropUi(show) {
    inputAreaEl.classList.toggle("dragover", show);
    uploadHint.classList.toggle("visible", show);
  }

  mainEl.addEventListener("dragover", (e) => {
    if (eventHasFiles(e)) e.preventDefault();
  });

  mainEl.addEventListener("dragenter", (e) => {
    if (!eventHasFiles(e)) return;
    e.preventDefault();
    dragDepth += 1;
    showDropUi(true);
  });

  mainEl.addEventListener("dragleave", (e) => {
    if (!eventHasFiles(e)) return;
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) showDropUi(false);
  });

  mainEl.addEventListener("drop", async (e) => {
    if (!eventHasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    showDropUi(false);
    const files = [...(e.dataTransfer?.files || [])];
    await addAttachmentsFromFiles(files);
  });

  // ── Cost & balance ────────────────────────────────────────────
  function updateCost(inputTokens, outputTokens) {
    const m = getCurrentModelDef();
    sessionCost += inputTokens * (m.input / 1_000_000) + outputTokens * (m.output / 1_000_000);
    costCounter.textContent = "$" + sessionCost.toFixed(5);
    costCounter.classList.add("visible");
  }

  async function fetchBalance() {
    try {
      const data = await fetch(`/balance?backend=${currentBackend}`).then(r => r.json());
      if (data.type === "pay-per-use") {
        balanceEl.textContent = "pay-per-use";
        balanceEl.classList.remove("low");
        return;
      }
      if (data.error) { balanceEl.textContent = "saldo: n/d"; return; }
      balanceEl.textContent = `saldo: $${data.remaining.toFixed(2)}`;
      if (data.remaining < 1) balanceEl.classList.add("low");
      else balanceEl.classList.remove("low");
    } catch { balanceEl.textContent = "saldo: n/d"; }
  }
  fetchBalance();
  setInterval(fetchBalance, 30000);

  // ── Server check ──────────────────────────────────────────────
  async function checkServer() {
    try { await fetch("/"); dot.classList.add("online"); }
    catch { dot.classList.remove("online"); }
  }
  checkServer();

  // ── Input auto-resize ─────────────────────────────────────────
  promptEl.addEventListener("input", () => {
    promptEl.style.height = "auto";
    promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + "px";
  });
  promptEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); triggerSend(); }
  });

  sendBtn.addEventListener("click", triggerSend);
  stopBtn.addEventListener("click", () => { if (abortController) abortController.abort(); });
  clearBtn.addEventListener("click", () => {
    history = []; currentConvId = null;
    messagesEl.innerHTML = "";
    clearPendingAttachments();
    sessionCost = 0;
    costCounter.textContent = "$0.00000";
    costCounter.classList.remove("visible");
    tokenCount.textContent = "";
    renderConvList();
  });

  function triggerSend() {
    const text = promptEl.value.trim();
    if ((!text && pendingAttachments.length === 0) || busy) return;
    const attachments = pendingAttachments.map(a => ({ ...a }));
    const capabilityError = getCapabilityError(attachments);
    if (capabilityError) {
      showStatus(capabilityError, true);
      return;
    }
    clearPendingAttachments();
    promptEl.value = "";
    promptEl.style.height = "auto";
    sendMessage(text, attachments);
  }

  // ── Send ──────────────────────────────────────────────────────
  async function sendMessage(text, attachments = []) {
    busy = true;
    sendBtn.disabled = true;
    stopBtn.style.display = "flex";

    const userHistIdx = history.length;
    history.push({ role: "user", content: text, attachments });
    renderUserMessage(text, userHistIdx, attachments);

    const assistantHistIdx = history.length;
    const activeModelLabel = getCurrentModelDef().label;
    history.push({ role: "assistant", content: "", model: activeModelLabel });

    // Render assistant placeholder
    const div = document.createElement("div");
    div.className = "message assistant";
    div.dataset.histIdx = assistantHistIdx;

    const label = document.createElement("div");
    label.className = "label";
    const labelText = document.createElement("span");
    labelText.textContent = activeModelLabel;
    label.appendChild(labelText);
    const editBtnEl = document.createElement("button");
    editBtnEl.className = "edit-btn";
    editBtnEl.textContent = "edit";
    editBtnEl.addEventListener("click", () => startAssistantEdit(div, contentEl, assistantHistIdx));
    label.appendChild(editBtnEl);

    const delBtnEl = document.createElement("button");
    delBtnEl.className = "del-btn";
    delBtnEl.textContent = "del";
    delBtnEl.addEventListener("click", () => deleteMessage(assistantHistIdx));
    label.appendChild(delBtnEl);

    div.appendChild(label);

    const contentEl = document.createElement("div");
    contentEl.className = "content";
    const typingEl = document.createElement("span");
    typingEl.className = "typing";
    typingEl.textContent = "···";
    contentEl.appendChild(typingEl);
    div.appendChild(contentEl);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    abortController = new AbortController();

    // Sliding window: send only last MAX_HISTORY messages
    const historyToSend = history.slice(0, -1); // exclude placeholder
    const windowedHistory = historyToSend.length > MAX_HISTORY
      ? historyToSend.slice(historyToSend.length - MAX_HISTORY)
      : historyToSend;

    let reply = "";

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: abortController.signal,
        body: JSON.stringify({
          messages: windowedHistory,
          max_tokens: parseInt(maxSlider.value),
          system_prompt: systemEl.value.trim(),
          backend: currentBackend,
          model: modelSelect.value,
        }),
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(errText || `HTTP ${res.status}`);
      }
      if (!res.body) {
        throw new Error("Risposta vuota dal server.");
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (line.startsWith("data: ") && line !== "data: [DONE]") {
            let data = {};
            try {
              data = JSON.parse(line.slice(6));
            } catch {
              continue;
            }
            if (data.usage) updateCost(data.usage.prompt_tokens || 0, data.usage.completion_tokens || 0);
            if (data.token) {
              typingEl.remove();
              reply += data.token;
              contentEl.textContent = reply;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            if (data.error) {
              typingEl.remove();
              contentEl.textContent = `Errore: ${normalizeErrorMessage(data.error, attachments)}`;
            }
          }
        }
      }
    } catch (err) {
      typingEl.remove();
      if (err.name === "AbortError") {
        if (!reply) contentEl.textContent = "[generazione interrotta]";
      } else {
        contentEl.textContent = `Errore: ${normalizeErrorMessage(err.message, attachments)}`;
      }
    }

    // Update history with actual reply
    history[assistantHistIdx].content = reply;
    updateTokenCount();

    // Auto-save after each exchange
    saveCurrentConversation();

    busy = false;
    sendBtn.disabled = false;
    stopBtn.style.display = "none";
    abortController = null;
    promptEl.focus();
  }
</script>
